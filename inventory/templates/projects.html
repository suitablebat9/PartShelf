{% extends 'base.html' %}{% block content %}<header><div><h1>Projects</h1></div></header><div class="two-columns"><section><div class="project-grid">{% for p in projects %}<a class="panel project-card" href="/projects/{{ p.id }}"><h2>{{ p.name }}</h2><p class="muted">{{ p.description }}</p><span class="pill">{{ p.lines }} component types</span></a>{% else %}<div class="panel empty"><h2>No projects yet</h2><p class="muted">Create a project and add the parts it needs.</p></div>{% endfor %}</div></section><section class="panel"><h2>New project</h2><form method="post"><fieldset class="form-fields" {{ 'disabled' if g.user.role=='viewer' }}><input type="hidden" name="csrf" value="{{ csrf() }}"><label>Project name<input name="name" required placeholder="Bench power supply"></label><label>Description<textarea name="description" rows="3"></textarea></label><button>Create project</button></fieldset></form></section></div>{% endblock %}
