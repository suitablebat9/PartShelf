<form class="filters panel" method="get" action="/search"><div class="search-row"><input aria-label="Search components" type="search" name="q" value="{{ request.args.get('q','') }}" placeholder="Search name, description, identifier, specs, or scan a code…"><button>Search</button></div><div class="filter-row"><select name="category_id" aria-label="Category"><option value="">All categories</option>{% for c in categories %}<option value="{{ c.id }}" {{ 'selected' if request.args.get('category_id')==c.id|string }}>{{ c.name }}</option>{% endfor %}</select><select name="location_id" aria-label="Storage"><option value="">All storage</option>{% for l in locations %}<option value="{{ l.id }}" {{ 'selected' if request.args.get('location_id')==l.id|string }}>{{ l.path }}</option>{% endfor %}</select><select name="supplier" aria-label="Supplier"><option value="">All suppliers</option>{% for s in suppliers %}<option {{ 'selected' if request.args.get('supplier')==s.supplier }}>{{ s.supplier }}</option>{% endfor %}</select><select name="stock" aria-label="Stock"><option value="">Any stock</option><option value="in" {{ 'selected' if request.args.get('stock')=='in' }}>In stock</option><option value="out" {{ 'selected' if request.args.get('stock')=='out' }}>Out of stock</option></select><select name="sort" aria-label="Sort">{% for value,label in [('name','Name A–Z'),('stock_asc','Stock: low to high'),('stock_desc','Stock: high to low'),('price','Unit price: low to high'),('new','Newest first')] %}<option value="{{ value }}" {{ 'selected' if request.args.get('sort','name')==value }}>{{ label }}</option>{% endfor %}</select><a class="muted" href="/">Reset</a></div></form>
