{% extends 'base.html' %}{% block content %}<header><h1>Add components to {{ location.name }}</h1><a class="button secondary" href="{{ back }}">Cancel</a></header><a class="button" href="{{ url_for('edit_component',location_id=location.id,back=back) }}">Create new component</a><section class="panel"><h2>Move existing components here</h2><input type="search" id="existing-search" placeholder="Find components" aria-label="Find existing components"><form method="post" action="/inventory/bulk"><input type="hidden" name="csrf" value="{{ csrf() }}"><input type="hidden" name="action" value="move"><input type="hidden" name="location_id" value="{{ location.id }}"><div class="bulk-list">{% for item in items %}<label class="check-label" data-existing-part><input type="checkbox" name="component_ids" value="{{ item.id }}"><span>{{ item.name }} · {{ item.name_id }}</span></label>{% else %}<p>No other components available.</p>{% endfor %}</div><button>Review move</button></form></section>{% endblock %}
