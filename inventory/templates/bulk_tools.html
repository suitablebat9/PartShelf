{% if g.user.role!='viewer' %}<section class="bulk-tools" hidden aria-label="Selected component actions"><form id="bulk-form" method="post" action="/inventory/bulk"><input type="hidden" name="csrf" value="{{ csrf() }}"><div class="actions"><span id="bulk-count" role="status">0 selected</span><label>Action<select name="action" id="bulk-action"><option value="move">Move to storage</option><option value="tag_add">Add tags</option><option value="tag_remove">Remove tags</option><option value="stock_add">Add stock to each</option><option value="stock_remove">Remove stock from each</option></select></label><label data-bulk-field="move">Storage<select name="location_id"><option value="">Unassigned</option>{% for l in locations %}<option value="{{ l.id }}">{{ l.path }}</option>{% endfor %}</select></label><label data-bulk-field="tag">Tags<input name="tags" placeholder="Separate with commas"></label><label data-bulk-field="stock">Quantity per component<input name="quantity" type="number" min="0.000001" step="any"></label><label data-bulk-field="stock">Reason<input name="reason" maxlength="500"></label><button id="bulk-submit" disabled>Preview changes</button></div></form></section>{% endif %}
